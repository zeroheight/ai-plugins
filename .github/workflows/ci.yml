name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: claude plugin validate --strict .
      # Not --strict: the validator warns that it can't follow the claude-code/skills symlink.
      - run: claude plugin validate ./claude-code
      - run: claude plugin validate --strict ./skills
      - run: claude plugin validate --strict ./claude-code/commands
      - run: node --test

  zed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: zed
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-wasip2 && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target wasm32-wasip2
